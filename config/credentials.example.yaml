# 微软登录凭据接口（yamb-plus 分支新增）
# 复制为 config/credentials.yaml —— 该文件已被 .gitignore 忽略，绝不提交！
#
# 结构：bot id（config/bots/<id>.yaml 的 id 或文件名）-> 凭据
# 优先级：credentials.yaml[id] > bots yaml 里的 account 段（上游行为）
# 路径可用环境变量 YAMB_CREDENTIALS_FILE 覆盖。
#
# bot1:
#   username: player_a
#   password: ""
#   auth: microsoft        # 或 offline
#
# 说明：
# - 微软登录的令牌缓存由 yamb .env 的 MC_PROFILES_FOLDER 管理，与本文件无关；
# - 本文件只解决「MC 账号名不该出现在 bots yaml（可能被截图/误提交）」的问题；
# - 不创建本文件时，yamb 行为与上游完全一致。
