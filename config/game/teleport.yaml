# 传送相关默认；waypoints / databaseFile 通常在 bot 实例中配置

# 默认数据库路径（bot 未指定时会被 ./data/<botId>.db 覆盖）
databaseFile: ./data/db.db
# 接受传送
tpacceptCommand: /tpaccept
# 拉人到身边
tpahereCommand: /tpahere
# 命名传送点
phomeCommand: /phome
# phome 后等待再发 tpahere（毫秒）
waypointDelayMs: 3000
# help / phome 用法中 {waypoints} 的固定展示文案（与输入用的 alias 无关）
waypointsHelp: ""
# 默认传送点列表（bot 可整段覆盖；alias 仅用于命令输入）
waypoints: []
