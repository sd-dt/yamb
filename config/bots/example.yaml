# 第二个 bot 示例：复制为 bot2.yaml 并设 enabled: true

id: bot2
enabled: false

account:
  username: another@example.com
  password: ""
  auth: microsoft
  profilesSubdir: bot2

adminList:
  - nanoite

astrbot:
  enabled: false
  port: 15101

command:
  prefix: "#bot2"

teleport:
  databaseFile: ./data/bot2.db
  waypoints: []

